<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="Calendrier : le 4 novembre l&#x27;Assemblée rejette la partie recettes du budget 2027, le Sénat vote sur les recettes vers le 28 novembre, examine les crédits de l&#x27;Anah le 1er décembre, vote l&#x27;ensemble du budget le 9 décembre ; le 1er janvier 2027 est la date annoncée de la fin de l&#x27;aide MaPrimeRénov&#x27; pour les pompes à chaleur air/eau et géothermiques.">
<rect width="900" height="470" fill="#ffffff"/>
<text x="40" y="54" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0f2744">Budget 2027 et MaPrimeRénov&#x27; : les dates</text>
<line x1="80" y1="250" x2="820" y2="250" stroke="#d9d2c3" stroke-width="4" stroke-linecap="round"/>
<circle cx="110" cy="250" r="14" fill="#9aa7b8" stroke="#ffffff" stroke-width="3"/>
<line x1="110" y1="236" x2="110" y2="206" stroke="#d9d2c3" stroke-width="2"/>
<text x="110" y="132" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2744">4 novembre</text>
<text x="110" y="158" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#52647c">L&#x27;Assemblée rejette la</text>
<text x="110" y="177" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#52647c">partie « recettes » du</text>
<text x="110" y="196" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#52647c">budget</text>
<circle cx="280" cy="250" r="14" fill="#0f2744" stroke="#ffffff" stroke-width="3"/>
<line x1="280" y1="264" x2="280" y2="294" stroke="#d9d2c3" stroke-width="2"/>
<text x="280" y="322" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2744">28 novembre</text>
<text x="280" y="348" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#52647c">Vote du Sénat sur les</text>
<text x="280" y="367" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#52647c">« recettes » (le 29</text>
<text x="280" y="386" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#52647c">est possible)</text>
<circle cx="450" cy="250" r="14" fill="#0f2744" stroke="#ffffff" stroke-width="3"/>
<line x1="450" y1="236" x2="450" y2="206" stroke="#d9d2c3" stroke-width="2"/>
<text x="450" y="151" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2744">1er décembre</text>
<text x="450" y="177" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#52647c">Le Sénat examine les</text>
<text x="450" y="196" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#52647c">crédits de l&#x27;Anah</text>
<circle cx="620" cy="250" r="14" fill="#0f2744" stroke="#ffffff" stroke-width="3"/>
<line x1="620" y1="264" x2="620" y2="294" stroke="#d9d2c3" stroke-width="2"/>
<text x="620" y="322" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2744">9 décembre</text>
<text x="620" y="348" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#52647c">Vote du Sénat sur</text>
<text x="620" y="367" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#52647c">l&#x27;ensemble du budget</text>
<circle cx="790" cy="250" r="14" fill="#c8102e" stroke="#ffffff" stroke-width="3"/>
<line x1="790" y1="236" x2="790" y2="206" stroke="#d9d2c3" stroke-width="2"/>
<text x="790" y="113" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2744">1er janvier 2027</text>
<text x="790" y="139" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#52647c">Date annoncée : fin de</text>
<text x="790" y="158" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#52647c">l&#x27;aide pour les pompes</text>
<text x="790" y="177" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#52647c">à chaleur air/eau et</text>
<text x="790" y="196" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#52647c">géothermiques</text>
<text x="450" y="438" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0f2744">Dates annoncées au 26 novembre 2026 : elles peuvent encore changer.</text>
</svg>
