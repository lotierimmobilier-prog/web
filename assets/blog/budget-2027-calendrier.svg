<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-label="Budget 2027 : le calendrier du projet de loi">
<rect width="900" height="490" fill="#ffffff"/>
<text x="40" y="54" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0f2744">Budget 2027 : le calendrier du projet de loi</text>
<line x1="70" y1="250" x2="830" y2="250" stroke="#d9d2c3" stroke-width="4" stroke-linecap="round"/>
<line x1="70" y1="250" x2="70" y2="216" stroke="#d9d2c3" stroke-width="2"/>
<circle cx="70" cy="250" r="11" fill="#8f7442" stroke="#ffffff" stroke-width="3"/>
<text x="48" y="133" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2744">1er octobre 2026</text>
<text x="48" y="159" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">Dépôt du projet à</text>
<text x="48" y="180" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">l&#x27;Assemblée</text>
<text x="48" y="201" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">nationale</text>
<line x1="222" y1="250" x2="222" y2="284" stroke="#d9d2c3" stroke-width="2"/>
<circle cx="222" cy="250" r="11" fill="#8f7442" stroke="#ffffff" stroke-width="3"/>
<text x="222" y="312" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2744">13 octobre 2026</text>
<text x="222" y="338" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">Début de l&#x27;examen</text>
<text x="222" y="359" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">par les députés</text>
<line x1="374" y1="250" x2="374" y2="216" stroke="#d9d2c3" stroke-width="2"/>
<circle cx="374" cy="250" r="11" fill="#8f7442" stroke="#ffffff" stroke-width="3"/>
<text x="374" y="112" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2744">Fin 2026</text>
<text x="374" y="138" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">Vote du</text>
<text x="374" y="159" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">Parlement, puis</text>
<text x="374" y="180" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">publication de la</text>
<text x="374" y="201" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">loi</text>
<line x1="526" y1="250" x2="526" y2="284" stroke="#d9d2c3" stroke-width="2"/>
<circle cx="526" cy="250" r="11" fill="#8f7442" stroke="#ffffff" stroke-width="3"/>
<text x="526" y="312" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2744">1er janvier 2027</text>
<text x="526" y="338" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">Entrée en vigueur</text>
<text x="526" y="359" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">prévue de la</text>
<text x="526" y="380" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">plupart des</text>
<text x="526" y="401" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">mesures</text>
<line x1="678" y1="250" x2="678" y2="216" stroke="#d9d2c3" stroke-width="2"/>
<circle cx="678" cy="250" r="11" fill="#8f7442" stroke="#ffffff" stroke-width="3"/>
<text x="678" y="112" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2744">Janvier à juin 2027</text>
<text x="678" y="138" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">Dons familiaux</text>
<text x="678" y="159" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">taxés à 6 %, si</text>
<text x="678" y="180" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">la mesure est</text>
<text x="678" y="201" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">votée</text>
<line x1="830" y1="250" x2="830" y2="284" stroke="#d9d2c3" stroke-width="2"/>
<circle cx="830" cy="250" r="11" fill="#8f7442" stroke="#ffffff" stroke-width="3"/>
<text x="852" y="312" text-anchor="end" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2744">1er septembre 2027</text>
<text x="852" y="338" text-anchor="end" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">Aide au logement</text>
<text x="852" y="359" text-anchor="end" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">des étudiants :</text>
<text x="852" y="380" text-anchor="end" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">nouveau choix</text>
<text x="852" y="401" text-anchor="end" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">pour les familles</text>
<text x="40" y="466" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#52647c">Calendrier indicatif : un projet de loi peut être modifié jusqu&#x27;au vote. LOTIER Immobilier, novembre 2026.</text>
</svg>
