<text x="323" y="338" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">Nouveau calcul pour le</text>
<text x="323" y="359" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">chauffage électrique :</text>
<text x="323" y="380" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">coefficient 1,9 au</text>
<text x="323" y="401" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">lieu de 2,3</text>
<line x1="577" y1="250" x2="577" y2="216" stroke="#d9d2c3" stroke-width="2"/>
<circle cx="577" cy="250" r="21" fill="#d9541e" stroke="#ffffff" stroke-width="3"/>
<text x="577" y="257" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">F</text>
<text x="577" y="154" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2744">1er janvier 2028</text>
<text x="577" y="180" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">Au tour des logements</text>
<text x="577" y="201" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">classés F</text>
<line x1="830" y1="250" x2="830" y2="284" stroke="#d9d2c3" stroke-width="2"/>
