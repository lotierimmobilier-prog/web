<text x="830" y="257" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">E</text>
<text x="852" y="312" text-anchor="end" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2744">1er janvier 2034</text>
<text x="852" y="338" text-anchor="end" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">Au tour des logements</text>
<text x="852" y="359" text-anchor="end" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#52647c">classés E</text>
<text x="40" y="446" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#52647c">Source : loi Climat et Résilience du 22 août 2021 ; arrêté du 13 août 2025. LOTIER Immobilier, novembre 2026.</text>
