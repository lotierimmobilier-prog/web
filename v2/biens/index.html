<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nos biens à vendre et à louer en Occitanie | Lotier Immobilier</title>
<meta name="description" content="Annonces immobilières Lotier Immobilier : biens à vendre et à louer à Montpellier, Nîmes, Béziers, Carcassonne et alentours.">
<link rel="canonical" href="https://www.lotier-immobilier.com/v2/biens/">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<a class="skip" href="#contenu">Aller au contenu</a>
<header class="top">
  <a class="brand" href="../">Lotier <span>Immobilier</span></a>
  <nav aria-label="Navigation principale">
    <a href="../#villes">Nos villes</a>
    <a href="../#metiers">Nos métiers</a>
    <a href="./" aria-current="page">Nos biens</a>
    <a class="btn" href="tel:+33467112831">04 67 11 28 31</a>
  </nav>
</header>
<main id="contenu" class="wrap" data-biens data-filtres data-src="../data/biens.json">
  <h1 class="h1-page">Nos biens en Occitanie</h1>
  <form class="filtres" onsubmit="return false">
    <label>Projet
      <select data-f="type"><option value="">Vente et location</option><option value="vente">Acheter</option><option value="location">Louer</option></select>
    </label>
    <label>Ville
      <select data-f="ville"><option value="">Toutes les villes</option></select>
    </label>
    <label>Prix maximum
      <select data-f="max"><option value="">Sans limite</option><option value="600">600 € (location)</option><option value="1000">1 000 € (location)</option><option value="100000">100 000 € (vente)</option><option value="200000">200 000 € (vente)</option><option value="400000">400 000 € (vente)</option></select>
    </label>
    <label>Tri
      <select data-f="tri"><option value="">Par défaut</option><option value="prix">Prix croissant</option><option value="-prix">Prix décroissant</option></select>
    </label>
  </form>
  <p class="biens-count" aria-live="polite"></p>
  <div class="biens-liste"></div>
  <p class="note">Honoraires, diagnostic énergétique (DPE) et détail de chaque bien : voir la fiche de l'annonce.
    <a href="https://www.lotier-immobilier.com/nos-biens/">Voir toutes les annonces sur le site actuel</a></p>
</main>
<footer>
  <p>© Lotier Immobilier · <a href="https://www.lotier-immobilier.com/mentions-legales/">Mentions légales</a></p>
</footer>
<script src="../biens.js" defer></script>
</body>
</html>
