# Mise à jour automatique des annonces de lotier.immo : chaque matin à 05h00 (heure de Paris),
# après le renouvellement de l'export par Hektor (vers 03h50).
#
# Elle lit l'export Hektor de l'agence (lotier-immo.zip, renouvelé chaque nuit), recopie les photos, régénère le site
# et, s'il y a du nouveau, le publie sur `main` — Hostinger redéploie alors tout seul (déploiement Git).
# Aucune annonce n'est jamais publiée à la main ici : tout vient de l'export Hektor (scripts/sync_annonces_export.py).
#
# Garde-fous (scripts/controle_maj.py) : si le résultat ressemble à un export incomplet (beaucoup moins d'annonces,
# de fiches ou de photos qu'avant), la mise à jour est REFUSÉE, rien n'est publié et le travail apparaît en échec
# dans l'onglet Actions (GitHub prévient par e-mail). Sans changement réel des annonces, aucun commit.
#
# GitHub ne planifie qu'en UTC : on déclenche à 03:00 et 04:00 UTC et on ne garde que l'exécution qui tombe à 05h
# à Paris (04:00 UTC en hiver, 03:00 UTC en été). Lancement à la main possible : onglet Actions → « Mise à jour des annonces ».
# Elle reprend aussi les contenus que Collab a figés au dernier « Publier » (data/contenu.json ; s'il est injoignable, le
# fichier actuel est conservé) et passe les mêmes contrôles que « Publier le site » (scripts/controle_publication.py).
# NB : ce fichier est AUSSI sur la branche par défaut du dépôt (claude/upbeat-goldberg-klipfg), car GitHub n'enregistre les tâches
# planifiées et les lancements manuels que depuis la branche par défaut. La tâche, elle, lit et publie sur `main`
# (celle que Hostinger déploie). Quand la branche par défaut sera `main`, cette copie pourra être supprimée.
# Activée le 2026-11-09 (Actions réactivées sur le dépôt par Jerome).
name: Mise à jour des annonces

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: maj-annonces
  cancel-in-progress: false

jobs:
  maj:
    name: Lire l'export Hektor et publier
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Heure de Paris
        id: heure
        run: |
          h=$(TZ=Europe/Paris date +%H)
          echo "Il est ${h}h à Paris."
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$h" != "05" ]; then
            echo "Pas 05h à Paris : cette exécution est laissée à son jumeau."
            echo "go=non" >> "$GITHUB_OUTPUT"
          else
            echo "go=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Récupérer le site
        if: steps.heure.outputs.go == 'oui'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python 3.12 et Pillow
        if: steps.heure.outputs.go == 'oui'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Pillow
        if: steps.heure.outputs.go == 'oui'
        run: pip install pillow rjsmin

      - name: Relire les annonces
        if: steps.heure.outputs.go == 'oui'
        run: |
          cp data/annonces.json "$RUNNER_TEMP/annonces-avant.json"
          python3 scripts/sync_annonces_export.py

      - name: Contrôler le résultat
        if: steps.heure.outputs.go == 'oui'
        run: python3 scripts/controle_maj.py "$RUNNER_TEMP/annonces-avant.json" "$RUNNER_TEMP/message.txt"

      - name: Récupérer les contenus de Collab
        if: steps.heure.outputs.go == 'oui'
        run: python3 scripts/recuperer_contenu.py --souple

      - name: Relire les agents de Collab
        if: steps.heure.outputs.go == 'oui'
        run: python3 scripts/sync_agents.py --souple

      - name: Régénérer le site
        if: steps.heure.outputs.go == 'oui'
        run: python3 scripts/generateur/build_all.py

      - name: Contrôler le site régénéré
        if: steps.heure.outputs.go == 'oui'
        run: python3 scripts/controle_publication.py

      - name: Publier s'il y a du nouveau
        if: steps.heure.outputs.go == 'oui'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Rien à publier."
            exit 0
          fi
          git config user.name "lotier-immo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -f "$RUNNER_TEMP/message.txt" ]; then
            git commit -q -F "$RUNNER_TEMP/message.txt"
          else
            git commit -q -m "Annonces : mise à jour automatique"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
          echo "publie=oui" >> "$GITHUB_ENV"

      # Prévient Bing et les moteurs associés des fiches créées, modifiées ou retirées (jamais bloquant).
      - name: Prévenir les moteurs (IndexNow)
        if: steps.heure.outputs.go == 'oui' && env.publie == 'oui'
        continue-on-error: true
        run: |
          sleep 120
          python3 scripts/indexnow.py HEAD~1 HEAD
